version: '3.9'

services:
  app:
    build: .
    container_name: pulseteams-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/teams_cleanroom
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
    depends_on:
      - mongodb
      - livekit

  mongodb:
    image: mongo:7.0
    container_name: pulseteams-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  livekit:
    image: livekit/livekit-server:latest
    container_name: pulseteams-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  mongodb_data:
